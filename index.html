<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTTE – HR Performance System</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1A237E;--blue2:#283593;--blue-bg:#E8EAF6;
  --red:#C62828;--red-bg:#FFEBEE;
  --green:#1B5E20;--green-bg:#E8F5E9;
  --purple:#4A148C;--purple-bg:#F3E5F5;
  --orange:#E65100;--orange-bg:#FFF3E0;
  --teal:#006064;--teal-bg:#E0F7FA;
  --text:#1A2332;--muted:#5F6B7A;--border:#E2E8F0;--bg:#EEF2F7;
  --sidebar-bg:#0F172A;--sidebar-w:234px;
  --hdr-h:54px;--r:10px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
}
html,body{height:100%;overflow:hidden;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text)}
.app-root{display:flex;flex-direction:column;height:100vh}

/* ── HEADER ── */
.app-hdr{height:var(--hdr-h);background:linear-gradient(135deg,#0D1B3E 0%,#1A237E 60%,#283593 100%);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:100}
/* LOTTE brand */
.lm-brand{display:flex;align-items:center;gap:10px}
.lm-logo-img{height:36px;width:auto;object-fit:contain;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.lm-logo-fallback{width:38px;height:38px;border-radius:9px;background:#E31E24;border:2px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(227,30,36,.4)}
.lm-brand-text{}
.lm-brand-name{font-size:14px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1}
.lm-brand-sub{font-size:9.5px;color:rgba(255,255,255,.5);font-weight:400;margin-top:1px}
.hdr-divider{width:1px;height:28px;background:rgba(255,255,255,.15);margin:0 14px}
.hdr-system{font-size:12px;font-weight:600;color:rgba(255,255,255,.55)}
/* Mode tabs */
.hdr-mode{display:flex;gap:3px;background:rgba(0,0,0,.22);border-radius:9px;padding:3px}
.hdr-btn{padding:7px 18px;border-radius:7px;border:none;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;color:rgba(255,255,255,.75);background:transparent;white-space:nowrap}
.hdr-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hdr-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}
.hdr-btn.kpi-btn.active{background:#fff;color:#C62828}
.hdr-btn.fb-btn.active{background:#fff;color:#4A148C}
.hdr-btn.rpt-btn.active{background:#fff;color:#1B5E20}
.hdr-emp{font-size:11px;color:rgba(255,255,255,.55);text-align:right;line-height:1.6;min-width:130px}
.hdr-emp b{color:rgba(255,255,255,.9);font-size:12px}

/* ── HAMBURGER (mobile menu toggle) ── */
.hamburger-btn{display:none;flex-direction:column;justify-content:center;gap:4px;
  width:34px;height:34px;border:none;background:rgba(255,255,255,.1);border-radius:8px;
  cursor:pointer;flex-shrink:0;margin-right:10px;padding:0}
.hamburger-btn span{display:block;width:16px;height:2px;background:#fff;margin:0 auto;border-radius:2px;transition:transform .2s,opacity .2s}
.hamburger-btn:hover{background:rgba(255,255,255,.18)}

/* ── SIDEBAR OVERLAY (mobile) ── */
.sidebar-overlay{display:none;position:fixed;top:var(--hdr-h);left:0;right:0;bottom:0;
  background:rgba(15,23,42,.55);z-index:150;opacity:0;transition:opacity .2s}

/* ── BODY ── */
.app-body{flex:1;display:flex;overflow:hidden}
.panel-full{flex:1;display:flex;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;
  flex-shrink:0;overflow:hidden;border-right:1px solid rgba(255,255,255,.04)}
.sidebar-kpi{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sk-title{font-size:9px;font-weight:700;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.sk-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sk-item{background:rgba(255,255,255,.05);border-radius:7px;padding:8px 10px;border:1px solid rgba(255,255,255,.06)}
.sk-item.wide{grid-column:1/-1}
.sk-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.sk-val{font-size:17px;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.sk-unit{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px}
.sk-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:4px}
.sk-badge.s{background:rgba(106,27,154,.4);color:#CE93D8}
.sk-badge.a{background:rgba(27,94,32,.4);color:#81C784}
.sk-badge.b{background:rgba(13,71,161,.4);color:#90CAF9}
.sk-badge.c{background:rgba(198,40,40,.4);color:#EF9A9A}
/* Section divider in sidebar */
.sidebar-section-hdr{font-size:9px;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.8px;padding:12px 14px 5px;border-top:1px solid rgba(255,255,255,.05);margin-top:4px}
.sidebar-section-hdr:first-child{border-top:none;margin-top:0}
.sidebar-nav{flex:1;overflow-y:auto;padding:4px 8px 4px}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;cursor:pointer;
  transition:all .15s;color:rgba(255,255,255,.5);font-size:12px;font-weight:500;margin-bottom:2px;
  user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.nav-item.active.kpi-nav{background:rgba(198,40,40,.3)}
.nav-item.active.fb-nav{background:rgba(106,27,154,.3)}
.nav-item.active.rpt-nav{background:rgba(27,94,32,.3)}
.ni-icon{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.06)}
.nav-item.active .ni-icon{background:rgba(255,255,255,.14)}
.ni-text{line-height:1.3}
.ni-sub{font-size:9.5px;color:rgba(255,255,255,.3);font-weight:400;display:block;margin-top:1px}
.nav-item.active .ni-sub{color:rgba(255,255,255,.5)}
.sidebar-footer{padding:10px 8px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.btn-rpt{width:100%;padding:9px 12px;border-radius:8px;border:none;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-rpt.kpi-rpt{background:linear-gradient(135deg,#C62828,#B71C1C);color:#fff;box-shadow:0 2px 8px rgba(198,40,40,.35)}
.btn-rpt.kpi-rpt:hover{background:linear-gradient(135deg,#D32F2F,#C62828);transform:translateY(-1px)}
.btn-rpt.fb-rpt{background:linear-gradient(135deg,#6A1B9A,#4A148C);color:#fff;box-shadow:0 2px 8px rgba(106,27,154,.35)}
.btn-rpt.fb-rpt:hover{background:linear-gradient(135deg,#7B1FA2,#6A1B9A);transform:translateY(-1px)}

/* ── MAIN AREA ── */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.main-topbar{height:44px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0}
.main-topbar .badge-mode{padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-mode.kpi{background:var(--red-bg);color:var(--red)}
.badge-mode.fb360{background:var(--purple-bg);color:var(--purple)}
.main-section-name{font-size:13.5px;font-weight:700;color:var(--text)}
.main-section-desc{font-size:11.5px;color:var(--muted)}
.main-content{flex:1;overflow-y:auto;padding:20px 22px}
.main-content::-webkit-scrollbar{width:6px}
.main-content::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}

/* ── CARDS ── */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
.card-title{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;background:#FAFBFC}
.card-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ci-red{background:var(--red-bg);color:var(--red)}
.ci-green{background:var(--green-bg);color:var(--green)}
.ci-blue{background:var(--blue-bg);color:var(--blue)}
.ci-purple{background:var(--purple-bg);color:var(--purple)}
.ci-teal{background:var(--teal-bg);color:var(--teal)}
.card-body{padding:14px 16px}

/* ── FORM FIELDS ── */
.form-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.field{flex:1;min-width:120px}
.field.wide{min-width:100%;flex:none}
.field label{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:8px 12px;border:1.5px solid #E2E8F0;border-radius:7px;
  font-family:inherit;font-size:13.5px;color:var(--text);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(40,53,147,.1)}
.field select{cursor:pointer}
.field textarea{resize:vertical;min-height:72px;font-size:13px;line-height:1.55}

/* ── ROLE BADGE STRIP ── */
.role-strip{display:flex;gap:8px;margin-bottom:14px}
.role-chip{flex:1;padding:8px 6px;border-radius:8px;text-align:center;border:2px solid transparent;cursor:pointer;transition:all .15s}
.role-chip.active{border-color:currentColor}
.role-chip.staff{background:#FFF3E0;color:#BF360C}
.role-chip.manager{background:#E8EAF6;color:#1A237E}
.role-chip.leader{background:#E8F5E9;color:#1B5E20}
.role-chip-title{font-size:12px;font-weight:700}
.role-chip-sub{font-size:9.5px;font-weight:500;opacity:.7;display:block;margin-top:2px}

/* ── KPI TABLE ── */
.kpi-tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:9px;margin-bottom:10px}
.kpi-tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:820px}
.kpi-tbl thead th{padding:7px 8px;font-size:10.5px;font-weight:700;text-align:center;white-space:nowrap}
.kpi-tbl th.base{background:#1E3A8A;color:#fff}
.kpi-tbl th.h1h{background:#6A1B9A;color:#fff}
.kpi-tbl th.h2h{background:#01579B;color:#fff}
.kpi-tbl th.yh{background:#1B5E20;color:#fff}
.kpi-tbl tbody td{padding:2px 4px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.kpi-tbl td.goal-cell{padding:7px 10px;background:#F8FAFC;min-width:170px;vertical-align:top}
.kpi-tbl td.goal-name{font-size:12px;font-weight:700;color:var(--text);display:block}
.kpi-tbl td.goal-std{font-size:10px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
.rank-mini{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.rank-mini span{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700}
.rm-s{background:#F3E5F5;color:#6A1B9A}
.rm-a{background:#E8F5E9;color:#1B5E20}
.rm-b{background:#E3F2FD;color:#01579B}
.rm-c{background:#FFF3E0;color:#E65100}
.kpi-tbl td.wt-cell{padding:6px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--blue);background:#EEF2FF;width:46px}
.kpi-tbl td.calc-cell{padding:6px 4px;text-align:center;font-size:12px;font-weight:700;background:#E8F5E9;color:var(--green)}
.kpi-tbl td.final-cell{padding:6px 4px;text-align:center;font-size:13px;font-weight:800;background:#E8F5E9;color:#1B5E20;width:58px}
.kpi-tbl td.rk-cell{padding:6px 4px;text-align:center;font-size:12px;font-weight:800;width:44px}
.rk-S{background:#F3E5F5;color:#6A1B9A}
.rk-A{background:#E8F5E9;color:#1B5E20}
.rk-B{background:#E3F2FD;color:#01579B}
.rk-C{background:#FFF3E0;color:#E65100}
.kpi-tbl td.actual-cell{padding:2px 3px;width:90px}
.kpi-tbl td.eval-cell{padding:2px 3px;width:64px}
.kpi-tbl input.actual-inp{width:100%;padding:4px 6px;border:1.5px solid #E2E8F0;border-radius:5px;font-size:11px;font-family:inherit;background:#fff;outline:none;text-align:center}
.kpi-tbl input.actual-inp:focus{border-color:var(--blue2)}
.rank-sel{width:56px;padding:3px 2px;border:1.5px solid #CBD5E1;border-radius:4px;font-size:11px;font-family:inherit;background:#fff;outline:none;cursor:pointer;text-align:center}
.rank-sel:focus{border-color:var(--blue2)}
.kpi-tbl tr.total-tr td{padding:7px 10px;background:#E8EAF6;font-weight:800;color:var(--blue);font-size:12px;text-align:center}
.kpi-tbl tr.total-tr td.total-label{text-align:left}
.kpi-tbl tr:not(.total-tr):hover td{background:#F8F9FF}
.kpi-tbl tr:not(.total-tr):hover td.goal-cell{background:#EEF2FF}

/* ── 360° FRAMEWORK DISPLAY ── */
.fb-flow{display:flex;align-items:stretch;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.fb-flow-block{flex:1;min-width:160px;border-radius:9px;border:1px solid var(--border);padding:12px 14px;background:#fff}
.fb-flow-role{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.fb-flow-arrow{font-size:12px;color:var(--muted);margin-bottom:6px}
.fb-rater-list{display:flex;flex-direction:column;gap:4px}
.fb-rater-chip{padding:4px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#F1F5F9;color:var(--muted)}
.fb-rater-chip.self{background:#EEF2FF;color:var(--blue)}
.fb-rater-chip.peer{background:#E8F5E9;color:var(--green)}
.fb-rater-chip.mgr{background:#FFF3E0;color:var(--orange)}

.dim-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.dim-card{border-radius:8px;border:1px solid var(--border);padding:12px 14px;background:#fff}
.dim-card-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.dim-card-num{width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dim-card-desc{font-size:11px;color:var(--muted);line-height:1.5}

/* 360° INPUT GRID */
.fb-input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.fb-input-card{background:#F8FAFC;border-radius:8px;border:1px solid var(--border);padding:12px}
.fb-input-card.self-card{background:#EEF2FF;border-color:#C5CAE9}
.fb-input-card.avg-card{background:#F3E5F5;border-color:#CE93D8}
.fb-input-card.team-card{background:#E8EAF6;border-color:#9FA8DA}
.fb-card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.07)}
.fb-card-lbl.self{color:var(--blue)}
.fb-card-lbl.peer{color:var(--green)}
.fb-card-lbl.mgr{color:var(--orange)}
.fb-card-lbl.avg{color:var(--purple)}
.fb-card-lbl.team{color:var(--blue)}
.fb-dim-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px}
.fb-dim-row .dim-lbl{font-size:11.5px;color:var(--text);flex:1;line-height:1.3}
.fb-score-inp{width:48px;padding:4px 6px;border:1.5px solid #E2E8F0;border-radius:5px;font-family:inherit;font-size:13px;text-align:center;outline:none;color:var(--text)}
.fb-score-inp:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(106,27,154,.1)}
.fb-score-inp:disabled{background:#F1F5F9;color:var(--muted);cursor:not-allowed;border-color:transparent}
.fb-avg-disp{width:48px;text-align:center;font-size:13px;font-weight:700;color:var(--purple);padding:4px 6px;background:#F3E5F5;border-radius:5px}
.fb-score-bar-wrap{margin-top:8px;padding:8px 0 2px;border-top:1px solid rgba(0,0,0,.07)}
.fb-score-bar-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fb-score-bar-row .brl{font-size:9.5px;color:var(--muted);width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-score-bar-bg{flex:1;height:5px;background:#E8EAF6;border-radius:3px;overflow:hidden}
.fb-score-bar-fill{height:100%;border-radius:3px;background:var(--blue);transition:width .3s}

/* ── 360° EVALUATION INPUT TABLE (card-based, no horizontal scroll needed) ── */
.fb-eval-tbl{border:1.5px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-bottom:16px}
.fb-eval-thead{display:grid;grid-template-columns:1fr auto 80px;background:#1E3A8A}
.fb-eval-th{color:#fff;padding:11px 16px;font-size:11px;font-weight:700}
.fb-eval-row{display:grid;grid-template-columns:1fr auto 80px;align-items:center;border-bottom:1px solid #F1F5F9}
.fb-eval-row:last-child{border-bottom:none}
.fb-eval-row.fb-eval-avg-row{background:#EEF2FF}
.fb-eval-cell-dim{padding:14px 16px}
.fb-eval-cell-rating{padding:10px 16px;display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap}
.fb-eval-cell-score{padding:10px 16px;text-align:center}
@media (max-width:640px){
  .fb-eval-thead{display:none}
  .fb-eval-row{grid-template-columns:1fr;gap:6px;padding:12px 14px}
  .fb-eval-cell-dim,.fb-eval-cell-rating,.fb-eval-cell-score{padding:0}
  .fb-eval-cell-rating{justify-content:flex-start}
  .fb-eval-cell-score{text-align:left}
  .fb-eval-row.fb-eval-avg-row .fb-eval-cell-dim{grid-column:auto!important}
}

/* ── REPORT ── */
.rpt-sidebar-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.8px;padding:12px 14px 6px}
.rpt-nav-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;
  color:rgba(255,255,255,.45);font-size:12px;cursor:pointer;margin-bottom:2px;
  transition:all .15s;font-weight:500;font-family:inherit;background:none;border:none;width:100%;text-align:left}
.rpt-nav-btn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.sidebar-actions{padding:10px 8px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px}
.btn-action{width:100%;padding:8px 12px;border-radius:7px;border:none;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px;justify-content:center}
.btn-print{background:rgba(255,255,255,.1);color:rgba(255,255,255,.82)}
.btn-print:hover{background:rgba(255,255,255,.16);color:#fff}
.btn-back{background:transparent;color:rgba(255,255,255,.35);font-size:11.5px}
.btn-back:hover{color:rgba(255,255,255,.7)}
/* Report sub-tabs */
.rpt-tab{padding:7px 18px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;color:#64748B;background:#fff}
.rpt-tab.active{background:#1A237E;color:#fff;border-color:#1A237E}
.rpt-tab:hover:not(.active){background:#F1F5F9;border-color:#CBD5E1}
.rpt-wrap{max-width:1100px;margin:0 auto;padding:24px 24px 48px}
.rpt{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:28px 32px;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.rpt-hdr{text-align:center;margin-bottom:20px;padding-bottom:18px;border-bottom:2.5px solid var(--red)}
.rpt-company{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.rpt-lotte-dot{width:16px;height:16px;background:#E31E24;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.rpt h2{font-size:15px;font-weight:800;color:#C62828;margin:4px 0;text-transform:uppercase;letter-spacing:.5px}
.rpt h3{font-size:13px;font-weight:600;color:var(--text)}
.rpt-date-line{font-size:12px;color:var(--muted);margin-top:5px}
.rpt .sec{font-weight:700;font-size:13px;margin:20px 0 10px;padding:6px 12px;border-radius:6px;border-left:4px solid}
.rpt .sec.kpi-sec{color:var(--red);background:var(--red-bg);border-color:var(--red)}
.rpt .sec.fb-sec{color:var(--purple);background:var(--purple-bg);border-color:var(--purple)}
.rpt table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px}
.rpt th{border:1px solid #90A4AE;padding:7px 10px;font-size:11.5px;font-weight:700;text-align:center}
.rpt th.left{text-align:left}
.rpt th.main-h{background:#1E3A8A;color:#fff}
.rpt th.h1h{background:#EDE7F6;color:#4A148C}
.rpt th.h2h{background:#E1F5FE;color:#01579B}
.rpt th.yh{background:#E8F5E9;color:#1B5E20}
.rpt td{border:1px solid #CFD8DC;padding:6px 10px}
.rpt td.c{text-align:center}
.rpt td.r{text-align:right;font-variant-numeric:tabular-nums}
.rpt td.b{font-weight:700}
.rpt td.hl{font-weight:700;color:var(--blue)}
.rpt td.bg{background:#F8FAFC}
.rpt td.total{background:#E8EAF6;font-weight:800;color:var(--blue);text-align:center}
.rpt td.rk-S{background:#F3E5F5;color:#6A1B9A;font-weight:800;text-align:center}
.rpt td.rk-A{background:#E8F5E9;color:#1B5E20;font-weight:800;text-align:center}
.rpt td.rk-B{background:#E3F2FD;color:#01579B;font-weight:800;text-align:center}
.rpt td.rk-C{background:#FFF3E0;color:#E65100;font-weight:800;text-align:center}
/* KPI summary cards */
.rpt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.rpt-kcard{border-radius:9px;padding:14px 16px;border:1px solid var(--border);position:relative;overflow:hidden}
.rpt-kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:9px 9px 0 0}
.kc-red::before{background:linear-gradient(90deg,#C62828,#E53935)}
.kc-purple::before{background:linear-gradient(90deg,#6A1B9A,#8E24AA)}
.kc-green::before{background:linear-gradient(90deg,#1B5E20,#388E3C)}
.kc-blue::before{background:linear-gradient(90deg,#1565C0,#1E88E5)}
.rkc-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.rkc-val{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.rkc-val.red{color:#C62828}.rkc-val.purple{color:#6A1B9A}.rkc-val.green{color:#1B5E20}.rkc-val.blue{color:#1565C0}
.rkc-unit{font-size:11px;color:#94A3B8;font-weight:500;margin-top:3px}
.rkc-sub{font-size:10.5px;color:var(--muted);margin-top:5px}
.rkc-prog-wrap{margin-top:10px;height:5px;background:#F1F5F9;border-radius:3px;overflow:hidden}
.rkc-prog-bar{height:100%;border-radius:3px;transition:width .4s}
.rkc-pct{font-size:10.5px;font-weight:600;margin-top:5px}
/* Perf block in report */
.rpt-perf-block{display:grid;grid-template-columns:1fr 220px;gap:20px;margin-bottom:20px;align-items:stretch}
.rpt-radar-wrap{border:1px solid var(--border);border-radius:9px;padding:14px 16px}
.rpt-radar-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:10px;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.rpt-radar-body{height:230px;position:relative}
.rpt-overall-wrap{border:1px solid var(--border);border-radius:9px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rpt-overall-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.rpt-overall-score{font-size:40px;font-weight:800;color:var(--purple);letter-spacing:-2px;line-height:1}
.rpt-overall-denom{font-size:20px;color:#94A3B8;font-weight:600}
.rpt-score-bar{margin:12px 0 6px;width:100%;height:8px;background:#F1F5F9;border-radius:4px;overflow:hidden}
.rpt-score-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#4A148C,#7B1FA2)}
.rpt-ranking-badge{display:inline-block;padding:5px 18px;border-radius:20px;font-size:15px;font-weight:800;margin-top:6px}
.rpt-ranking-badge.S{background:#F3E5F5;color:#6A1B9A;border:2px solid #CE93D8}
.rpt-ranking-badge.A{background:#E8F5E9;color:#1B5E20;border:2px solid #A5D6A7}
.rpt-ranking-badge.B{background:#E3F2FD;color:#01579B;border:2px solid #90CAF9}
.rpt-ranking-badge.C{background:#FFF3E0;color:#E65100;border:2px solid #FFCC80}
/* Employee info row */
.emp-info-row{display:flex;flex-wrap:wrap;margin-bottom:20px;border:1.5px solid #C62828;border-radius:8px;overflow:hidden}
.emp-info-item{flex:1;min-width:110px;padding:8px 14px;text-align:center;border-right:1px solid #FFCDD2}
.emp-info-item:last-child{border-right:none}
.ei-lbl{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px}
.ei-val{font-size:13px;font-weight:700;color:var(--text)}
/* Strength block */
.strength-block{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.strength-card{border-radius:8px;border:1px solid var(--border);padding:14px 16px}
.strength-hdr{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;padding:6px 12px;border-radius:6px}
.sh-green{background:var(--green-bg);color:var(--green)}
.sh-orange{background:var(--orange-bg);color:var(--orange)}
.strength-item{font-size:12px;color:var(--text);margin-bottom:6px;padding-left:14px;position:relative;line-height:1.55}
.strength-item::before{content:'•';position:absolute;left:0;color:#94A3B8}
/* Sign */
.rpt .sign{display:flex;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.rpt .sign-box{text-align:center;min-width:160px}
.rpt .sign-role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.rpt .sign-space{height:44px;border-bottom:1px solid #CBD5E1;margin-bottom:8px}
.rpt .sign-name{font-weight:700;font-size:14px}
.rpt .sign-date{font-size:12px;color:var(--muted);margin-top:3px}
.hidden{display:none!important}
@media(max-width:800px){.rpt .strength-block,.rpt-kpis,.rpt-perf-block{grid-template-columns:1fr}}
@media print{
  .sidebar,.app-hdr,.rpt-wrap>*:not(.rpt){display:none!important}
  .app-root,.app-body,.main-area{height:auto;overflow:visible}
  .main-content{overflow:visible;padding:0}
  .rpt{box-shadow:none;border:none}
  @page{margin:1.5cm}
}

/* ══════════════════════════════════════════════════════════
   RESPONSIVE — TABLET (≤900px): sidebar becomes off-canvas drawer
   ══════════════════════════════════════════════════════════ */
@media (max-width:900px){
  .hamburger-btn{display:flex}
  .hdr-divider,.hdr-system{display:none}
  .lm-brand-sub{display:none}
  .app-hdr{padding:0 12px}

  .sidebar{
    position:fixed;top:var(--hdr-h);left:0;bottom:0;
    width:min(78vw,260px);
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:200;
    box-shadow:4px 0 18px rgba(0,0,0,.3);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block;opacity:1}

  .main-topbar{flex-wrap:wrap;height:auto;min-height:44px;padding:8px 14px;gap:8px 12px}
  .main-content{padding:14px}
  .rpt-wrap{padding:14px 12px 40px}
  .rpt{padding:18px 16px}
  .card-body{padding:10px}
  .hdr-emp{min-width:0;font-size:10px}
  .hdr-emp select{min-width:0!important;max-width:38vw;font-size:11px!important}

  .emp-info-bar{flex-wrap:wrap!important}
  .emp-info-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}
  .rpt-info-grid{grid-template-columns:repeat(2,1fr)!important}
  .kpi-result-row{flex-direction:column!important}
  .score-chips-grid{grid-template-columns:repeat(2,1fr)!important}
  .team-summary-row{flex-wrap:wrap!important}
  .team-summary-row>div{flex:1 1 calc(50% - 6px)!important}

  .dim-cards,.fb-input-grid{grid-template-columns:1fr!important}
  .fb-flow{flex-direction:column}
  .role-strip{flex-wrap:wrap}
  .fb360-summary-row{flex-direction:column!important;min-height:0!important}
  .fb360-summary-row>div{border-right:none!important;border-bottom:1px solid var(--border)}
  .fb360-summary-row>div:last-child{border-bottom:none}
}

/* ══════════════════════════════════════════════════════════
   RESPONSIVE — PHONE (≤560px)
   ══════════════════════════════════════════════════════════ */
@media (max-width:560px){
  .lm-brand-name{font-size:12px}
  .app-hdr{padding:0 8px}
  .lm-logo-img,.lm-logo-fallback{height:28px;width:28px}
  .main-content{padding:10px}
  .card-title{padding:9px 12px;font-size:12px}
  .rpt{padding:14px 10px;font-size:11.5px}
  .rpt-wrap{padding:10px 8px 32px}
  .main-section-name{font-size:12px}
  .main-section-desc{display:none}
  .rpt-tab{padding:6px 12px;font-size:11px}
  .form-row{gap:8px}
  .field{min-width:100%}
  .rpt-info-grid{grid-template-columns:1fr!important}
  .score-chips-grid{grid-template-columns:1fr!important}
  .team-summary-row>div{flex:1 1 100%!important}
  .emp-info-grid{grid-template-columns:1fr!important}
}
</style>
</head>

const $ = id => document.getElementById(id);
const fmt = (v,d=2) => (isNaN(v)||v==null)?'—':Number(v).toFixed(d);
const evalScore = r => RANK_SCORE[r]||8;
const getDims = () => (D.role==='staff')?DIMS_STAFF:DIMS_MGR;
const getTasks = () => TASK_KPIS[D.role]||TASK_KPIS.staff;
function getRank(s){ return s>=9.5?'S':s>=8.5?'A':s>=7.5?'B':'C'; }

function scoreKpi(k){
  const h1=(evalScore(k.h1e1)+evalScore(k.h1e2))/2;
  const h2=(evalScore(k.h2e1)+evalScore(k.h2e2))/2;
  const fin=h1*0.3+h2*0.7;
  return {h1,h2,fin,contrib:fin*(k.weight/100)};
}

// ══ CALC ══════════════════════════════════════════════════
function calc(){
  let sc=0,tc=0,cc=0;
  const sS=SALES_KPIS.map(k=>{const s=scoreKpi(k);sc+=s.contrib;return{...k,...s};});
  const tS=getTasks().map(k=>{const s=scoreKpi(k);tc+=s.contrib;return{...k,...s};});
  const cS=COMP_KPIS.map(k=>{const s=scoreKpi(k);cc+=s.contrib;return{...k,...s};});
  const total=sc+tc+cc, score5=total/2;
  const dims=getDims();
  const fb_avg=dims.map((_,i)=>{
    const vs=[FB.r1[i],FB.r2[i],FB.r3[i],FB.r4[i],FB.r5[i],FB.r6[i],FB.r7[i]].filter(v=>v>0);
    return vs.length ? vs.reduce((a,v)=>a+v,0)/vs.length : 0;
  });
  const fb_overall=fb_avg.reduce((a,v)=>a+v,0)/fb_avg.length;
  return{sS,tS,cS,sc,tc,cc,total,score5,fb_avg,fb_overall,ranking:getRank(total)};
}

function updateLiveKPI(){
  const c=calc();
  const set=(id,v)=>{const e=$(id);if(e)e.textContent=v;};
  set('skKpiTotal',fmt(c.total,2));
  set('skKpi5',fmt(c.score5,2));
  set('skSales',fmt(c.sc,4));
  set('skTasks',fmt(c.tc,4));
  set('skComp',fmt(c.cc,4));
  set('sk360Avg',fmt(c.fb_overall,2));
  // hdrEmp is a static select – do not overwrite
  if($('skKpiRank')){
    const cls={S:'s',A:'a',B:'b',C:'c'}[c.ranking];
    const lbl={S:'Outstanding',A:'Exceed Expectation',B:'Satisfactory',C:'Average'}[c.ranking];
    $('skKpiRank').innerHTML=`<span class="sk-badge ${cls}">${c.ranking} · ${lbl}</span>`;
  }
  if($('sk360Dims')){
    const dims=getDims();
    $('sk360Dims').innerHTML=dims.slice(0,3).map((d,i)=>`
      <div class="sk-item"><div class="sk-lbl">${d.name.split(' ').slice(0,2).join(' ')}</div>
      <div class="sk-val" style="font-size:15px">${fmt(c.fb_avg[i],1)}</div><div class="sk-unit">/ 5.0</div></div>`).join('');
  }
  ['sales','tasks','comp'].forEach(cat=>{
    const kpis=cat==='sales'?SALES_KPIS:cat==='comp'?COMP_KPIS:getTasks();
    kpis.forEach((k,i)=>{
      const s=scoreKpi(k), rk=getRank(s.fin);
      const upd=(sfx,v,cls)=>{const e=$(`${cat}_${i}_${sfx}`);if(!e)return;e.textContent=v;if(cls)e.className=cls;};
      upd('h1avg',fmt(s.h1,2));upd('h2avg',fmt(s.h2,2));upd('yr',fmt(s.fin,2));upd('rk',rk,'rk-cell rk-'+rk);
    });
    const tot=kpis.reduce((s,k)=>s+scoreKpi(k).contrib,0);
    const te=$(`${cat}_total`);if(te)te.textContent=fmt(tot,4)+' pts';
  });
}

// ══ ROLE SWITCH ═══════════════════════════════════════════
function submitKpiEval(){
  const c=calc();
  const btn=document.querySelector('[onclick="submitKpiEval()"]');
  if(btn){
    btn.textContent='✓ Submitted!';
    btn.style.background='#1B5E20';
    btn.disabled=true;
    setTimeout(()=>{
      btn.textContent='✓ Submit Evaluation';
      btn.style.background='#1E3A8A';
      btn.disabled=false;
    },3000);
  }
  console.log('KPI Evaluation submitted for',D.name,'– Total:',c.total.toFixed(2),'Rank:',c.ranking);
}

function setRole(r){
  D.role=r;
  KPIS_REF.tasks=getTasks();
  renderKpiSection();
  updateLiveKPI();
}

// ══ RENDER 360° – SINGLE PAGE ═════════════════════════════
function renderFb360EvalSection(){
  const dims=getDims();
  const raterKeys=['r1','r2','r3','r4','r5','r6','r7'];
  const raterLabels={
    staff:['Peer 1','Peer 2','Direct Manager','Cross-dept Peer','Dept Head','Peer 3','Senior Peer'],
    manager:['Staff 1','Staff 2','Team Leader','Cross-dept','Skip-level','Peer Manager','Director'],
    leader:['Manager 1','Manager 2','Director','Cross-div','Board Rep','Peer Leader','Advisor']
  };
  const labels=(raterLabels[D.role]||raterLabels.staff);
  const sel=$('fb360EvalRaterSel');
  const evalKey=(sel&&sel.value)||'r1';
  const curScores=FB[evalKey]?[...FB[evalKey]]:[0,0,0,0,0,0];

  const raterOpts=raterKeys.map((k,i)=>
    `<option value="${k}"${k===evalKey?' selected':''}>${labels[i]}</option>`).join('');

  const scoreBtn=(rk,di,v)=>{
    const active=curScores[di]===v;
    const cols=['','#B71C1C','#6A1B9A','#E65100','#1565C0','#1B5E20'];
    const col=cols[v]||'#64748B';
    const bg=active?col:'#F8FAFC';
    const fc=active?'#fff':'#94A3B8';
    const border=active?col:'#E2E8F0';
    return `<button onclick="setFb360Score('${rk}',${di},${v})" style="width:38px;height:38px;border:2px solid ${border};border-radius:8px;background:${bg};color:${fc};font-size:13px;font-weight:800;cursor:pointer;transition:all .12s">${v}</button>`;
  };

  const scaleDesc=[
    {v:1,lbl:'Poor',col:'#B71C1C'},
    {v:2,lbl:'Below Avg',col:'#6A1B9A'},
    {v:3,lbl:'Good',col:'#E65100'},
    {v:4,lbl:'Very Good',col:'#1565C0'},
    {v:5,lbl:'Excellent',col:'#1B5E20'}
  ];

  const rows=dims.map((d,i)=>`
    <div class="fb-eval-row">
      <div class="fb-eval-cell-dim">
        <div style="font-weight:700;font-size:12.5px;color:#0F172A">${d.name}</div>
        <div style="font-size:10.5px;color:#94A3B8;margin-top:2px;line-height:1.4">${d.desc}</div>
      </div>
      <div class="fb-eval-cell-rating">
        ${[1,2,3,4,5].map(v=>scoreBtn(evalKey,i,v)).join('')}
      </div>
      <div class="fb-eval-cell-score">
        ${curScores[i]>0
          ? `<span style="font-size:22px;font-weight:900;color:#1565C0">${curScores[i]}</span>`
          : `<span style="font-size:16px;color:#CBD5E1">—</span>`}
      </div>
    </div>`).join('');

  const filled=curScores.filter(v=>v>0);
  const avg=filled.length?filled.reduce((a,v)=>a+v,0)/filled.length:0;
  const progress=Math.round(filled.length/dims.length*100);

  $('fb360EvalContent').innerHTML=`
    <div style="background:#fff;border-radius:12px;padding:24px 28px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);font-family:'Be Vietnam Pro',system-ui,sans-serif">

      <!-- Header -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid #E8EAF6;padding-bottom:16px;margin-bottom:20px">
        <div>
          <div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">360° Review Evaluation</div>
          <div style="font-size:20px;font-weight:800;color:#0F172A">Evaluator: <span style="color:#1565C0">${D.name}</span></div>
          <div style="font-size:12px;color:#64748B;margin-top:3px">${D.position} · ${D.team}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <div style="font-size:11px;color:#64748B;font-weight:600">You are evaluating as:</div>
          <select id="fb360EvalRaterSel" onchange="renderFb360EvalSection()" style="padding:7px 14px;border:1.5px solid #CBD5E1;border-radius:8px;font-size:12.5px;font-family:inherit;background:#fff;cursor:pointer;font-weight:700;color:#1E3A8A;outline:none">
            ${raterOpts}
          </select>
          <div style="font-size:10px;color:#94A3B8">Progress: ${progress}% (${filled.length}/${dims.length} dimensions)</div>
        </div>
      </div>

      <!-- Scale legend -->
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        ${scaleDesc.map(s=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px">
          <span style="width:24px;height:24px;border-radius:6px;background:${s.col};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">${s.v}</span>
          <span style="color:#64748B">${s.lbl}</span>
        </div>`).join('')}
      </div>

      <!-- Table -->
      <div class="fb-eval-tbl">
        <div class="fb-eval-thead">
          <div class="fb-eval-th">Dimension</div>
          <div class="fb-eval-th" style="text-align:center">Rating (click to select)</div>
          <div class="fb-eval-th" style="text-align:center">Score</div>
        </div>
        <div class="fb-eval-tbody">
          ${rows}
          <div class="fb-eval-row fb-eval-avg-row">
            <div class="fb-eval-cell-dim" style="grid-column:1/3;font-size:12px;font-weight:700;color:#1E3A8A;display:flex;align-items:center">Average Score (${filled.length}/${dims.length} rated)</div>
            <div class="fb-eval-cell-score">
              ${avg>0?`<span style="font-size:22px;font-weight:900;color:#1565C0">${avg.toFixed(2)}</span><div style="font-size:9px;color:#64748B">/ 5.00</div>`:'<span style="color:#CBD5E1;font-size:18px">—</span>'}
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button onclick="resetFb360Eval()" style="padding:9px 20px;border:1.5px solid #E2E8F0;border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:#64748B;cursor:pointer;font-family:inherit">↺ Reset</button>
        <button onclick="saveFb360Eval()" style="padding:9px 24px;border:none;border-radius:8px;background:#1E3A8A;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">✓ Submit</button>
      </div>
    </div>`;
}

function setFb360Score(rk,di,v){
  if(!FB[rk])FB[rk]=[0,0,0,0,0,0];
  FB[rk][di]=(FB[rk][di]===v)?0:v;
  renderFb360EvalSection();
}
function resetFb360Eval(){
  const rk=$('fb360EvalRaterSel')?$('fb360EvalRaterSel').value:'r1';
  FB[rk]=[0,0,0,0,0,0];
  renderFb360EvalSection();
}
function saveFb360Eval(){
  const rk=$('fb360EvalRaterSel')?$('fb360EvalRaterSel').value:'r1';
  const n=getDims().length;
  const filled=(FB[rk]||[]).filter(v=>v>0).length;
  if(filled<n){alert('Please rate all '+n+' dimensions before saving.');return;}
  const btn=document.activeElement;
  if(btn){btn.textContent='✓ Submitted!';btn.style.background='#1B5E20';setTimeout(()=>{btn.textContent='✓ Submit';btn.style.background='#1E3A8A';},2000);}
}

// ══ 360° RADAR CHART ══════════════════════════════════════
function init360RadarChart(dims,fb_avg){
  const ctx=$('fb360RadarCanvas');if(!ctx)return;
  if(fb360Chart){fb360Chart.destroy();fb360Chart=null;}
  fb360Chart=new Chart(ctx,{type:'radar',
    data:{labels:dims.map(d=>d.name),datasets:[
      {label:'Avg Score',data:[...fb_avg],borderColor:'#4A148C',backgroundColor:'rgba(74,20,140,.15)',borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#4A148C'},
      {label:'Team Ref',data:[...FB.team],borderColor:'#1B5E20',backgroundColor:'rgba(27,94,32,.07)',borderWidth:1.5,pointRadius:3,pointBackgroundColor:'#1B5E20',borderDash:[4,3]},
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:250},
      plugins:{legend:{position:'top',labels:{boxWidth:10,padding:8,font:{size:10,family:'Be Vietnam Pro'}}}},
      scales:{r:{min:0,max:5,ticks:{stepSize:1,font:{size:8}},
        pointLabels:{font:{size:9,family:'Be Vietnam Pro'}},
        grid:{color:'#E8EAF6'},angleLines:{color:'#E8EAF6'}}}}
  });
}

function update360Chart(){
  const dims=getDims();
  const fb_avg=dims.map((_,i)=>{

        <span style="display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:800;background:${rkBg[e.rank]};color:${rkColor[e.rank]}">${e.rank}</span>
      </td>
      <td style="padding:10px 14px;text-align:center;font-size:13px;font-weight:700;color:#4A148C">${fmt(e.fb_demo||0,2)}</td>
      <td style="padding:10px 14px;text-align:center">
        <select id="hrClass_${e.idx}" onchange="HR_CLASS[${e.idx}]=this.value"
          style="padding:5px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:11px;font-family:inherit;color:var(--text);background:#fff;cursor:pointer;min-width:110px">
          ${hrOptions}
        </select>
      </td>
    </tr>`).join('');

  $('reportContent').innerHTML=`
    <!-- Filter bar -->
    <div style="background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      ${deptFilterHTML}
      <div style="font-size:11px;color:#94A3B8">Period: <b style="color:#475569">${EMPLOYEES[0].period||'2025'}</b></div>
    </div>

    <!-- KPI Summary cards -->
    <div id="team-summary" style="background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.07)">
      <div style="font-size:13px;font-weight:800;color:#1A237E;text-transform:uppercase;letter-spacing:.3px;padding-bottom:12px;border-bottom:2px solid #E8EAF6;margin-bottom:16px">
        KPI Performance Distribution
        <span style="font-size:11px;font-weight:500;color:#94A3B8;text-transform:none;margin-left:10px">All ${filtered.length} employee${filtered.length!==1?'s':''} · Sorted by KPI Score</span>
      </div>
      <div class="team-summary-row" style="display:flex;gap:12px">${summaryCards}</div>
    </div>

    <!-- Employee list table -->
    <div id="team-list" style="background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 6px rgba(0,0,0,.07)">
      <div style="font-size:13px;font-weight:800;color:#1A237E;text-transform:uppercase;letter-spacing:.3px;padding-bottom:12px;border-bottom:2px solid #E8EAF6;margin-bottom:16px">
        Employee KPI Rankings
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="background:#F1F5F9">
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">Full Name</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px">Department</th>
              <th style="padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px">Position</th>
              <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px">Grade</th>
              <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:#C62828;text-transform:uppercase;letter-spacing:.4px">KPI Score</th>
              <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:#C62828;text-transform:uppercase;letter-spacing:.4px">KPI Rank</th>
              <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:#4A148C;text-transform:uppercase;letter-spacing:.4px">360° Avg</th>
              <th style="padding:10px 14px;text-align:center;font-size:11px;font-weight:700;color:#1B5E20;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap">HR Classification</th>
            </tr>
          </thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      <div style="margin-top:12px;font-size:10.5px;color:#94A3B8;font-style:italic">
        * HR Classification is manually entered by HR department. Values: Excellent / G1 / G2 / G3 / NG
      </div>
    </div>`;

  // Restore saved HR_CLASS values
  emps.forEach(e=>{
    const sel=$('hrClass_'+e.idx);
    if(sel && HR_CLASS[e.idx]) sel.value=HR_CLASS[e.idx];
  });
}

// ══ EMPLOYEE SELECTOR ═════════════════════════════════════
function initEmpSelector(){
  const el=$('hdrEmp'); if(!el) return;
  el.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
      <div style="font-size:9px;font-weight:700;letter-spacing:.6px;color:rgba(255,255,255,.45);text-transform:uppercase">Employee</div>
      <div style="position:relative">
        <select id="empSelect" onchange="loadEmployee(+this.value)"
          style="appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
          border-radius:7px;color:#fff;font-family:inherit;font-size:12px;font-weight:600;
          padding:5px 28px 5px 11px;cursor:pointer;outline:none;min-width:180px;text-align:right">
          ${EMPLOYEES.map((e,i)=>`<option value="${i}" style="background:#1E2942;color:#fff">${e.name} · ${e.team}</option>`).join('')}
        </select>
        <span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.6);pointer-events:none">▾</span>
      </div>
    </div>`;
}

function loadEmployee(idx){
  const emp=EMPLOYEES[idx]; if(!emp) return;
  Object.assign(D,emp);
  KPIS_REF.tasks=getTasks();
  renderKpiSection();
  if($('fb360Container')&&$('fb360Panel')&&!$('fb360Panel').classList.contains('hidden'))renderFbSection();
  if($('reportPanel')&&!$('reportPanel').classList.contains('hidden'))renderReport();
  updateLiveKPI();
  if($('empSelect'))$('empSelect').value=idx;
}

// ══ INIT ══════════════════════════════════════════════════
KPIS_REF.tasks=getTasks();
renderKpiSection();
initEmpSelector();
updateLiveKPI();
</script>
</body>
</html>
